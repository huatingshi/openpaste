name: Windows tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/run.ps1
      - name: Check launcher help
        shell: powershell
        run: ./openpaste.cmd -Help
